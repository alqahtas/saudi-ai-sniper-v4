
name: Saudi AI Sniper - V7 Strategy Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v7-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy pandas requests

      - name: Run V7 Strategy Research
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python ai_strategy_engine.py 1120 2010 7010

      - name: Upload V7 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-strategy-v7-results
          path: ai_strategy_results.json
          if-no-files-found: warn
          retention-days: 14
