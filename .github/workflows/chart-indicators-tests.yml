name: Chart indicators offline verification
on:
  pull_request:
  push:
    branches: [feat/chart-ema-fibonacci-20261113]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python scripts/run_offline_tests.py
