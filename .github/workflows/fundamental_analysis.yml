
name: Saudi AI Sniper - Fundamental Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fundamental-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fundamental analysis
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: python fundamental_engine.py 1120 2010 7010

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-analysis-results
          path: fundamental_results.json
          if-no-files-found: warn
          retention-days: 14
