name: Saudi Market Closing Bulletin
on:
  schedule:
    - cron: '20 12 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-close-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Send post-close TASI bulletin
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_close_report.py
