name: Saudi AI Sniper Safe Tests

on:
  push:
    branches:
      - fix/sahmk-integration-review-20261101
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run offline unit tests
        run: |
          python -m unittest -v test_smoke.py
          python -m unittest discover -s tests -v
