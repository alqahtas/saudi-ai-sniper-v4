
name: Saudi AI Sniper - Strategy Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strategy research
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: python strategy_lab.py

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-strategy-lab-results
          path: |
            strategy_lab_results.json
            strategy_lab_results.csv
          if-no-files-found: warn
          retention-days: 14
