name: Saudi AI Sniper - Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    # 13:30 Asia/Riyadh = 10:30 UTC; schedule is not intraday continuous
    - cron: '30 10 * * 0-4'

permissions:
  contents: read

concurrency:
  group: saudi-ai-sniper-telegram
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Telegram connection
        run: |
          python - <<'PY'
          from telegram_delivery import broadcast
          result = broadcast("✅ Saudi AI Sniper - Telegram connection successful")
          if not all(result.values()):
              raise RuntimeError("At least one configured Telegram target failed")
          print("Telegram targets verified:", len(result))
          PY

      - name: Scan TASI and send qualified alerts
        run: |
          python -u telegram_scan.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-market-scan
          path: |
            market_scan_result.json
            market_scan_summary.txt
          if-no-files-found: ignore
