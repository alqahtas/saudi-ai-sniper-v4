name: Saudi AI Sniper - Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 0-4'

permissions:
  contents: read

concurrency:
  group: saudi-ai-sniper-telegram
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Telegram connection
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "✅ Saudi AI Sniper V5 - Telegram connection successful"
              },
              timeout=30,
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise RuntimeError("Telegram rejected test message")

          print("Telegram connection successful")
          PY

      - name: Scan TASI and send qualified alerts
        run: |
          python -u telegram_scan.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-market-scan
          path: |
            market_scan_result.json
            market_scan_summary.txt
          if-no-files-found: ignore
