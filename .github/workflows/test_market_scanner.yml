
name: Test Market Scanner

on:
  workflow_dispatch:

jobs:
  test-market:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy

      - name: Scan entire TASI market
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python -u - <<'PY'
          from market_scanner import run

          result = run(
              max_candidates=50,
              quote_budget=0
          )

          total = result["universe_size"]
          failed = len(result["historical_failures"])
          selected = len(result["historical_candidates"])

          print("TASI stocks found:", total)
          print("Successfully analyzed:", total - failed)
          print("Historical failures:", failed)
          print("Top candidates:", selected)

          for stock in result["historical_candidates"][:10]:
              print(
                  stock["السهم"],
                  stock["اسم_الشركة"],
                  "Score:", stock["درجة_الجودة"],
                  "Status:", stock["الحالة"]
              )

          if total == 0 or total - failed == 0:
              raise RuntimeError("No stocks analyzed")
          PY

      - name: Save market scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasi-market-scan
          path: market_scan_result.json
          if-no-files-found: warn
