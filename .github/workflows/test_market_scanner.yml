
name: Test Market Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-market:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests yfinance pandas numpy

      - name: Scan entire TASI market
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python -u - <<'PY'
          from market_scanner import run

          result = run(
              max_candidates=50,
              quote_budget=0
          )

          total = result.get("universe_size", 0)
          summary = result.get("summary") or {}
          failed = result.get("historical_failures") or []
          candidates = result.get("historical_candidates") or []
          weekly = result.get("weekly_candidates") or []

          analyzed = int(summary.get("analyzed", 0))

          print("\n========== TASI SCAN ==========")
          print("Stocks selected:", total)
          print("Successfully analyzed:", analyzed)
          print("Historical failures:", len(failed))
          print("Watchlist candidates:", len(candidates))
          print("Weekly setups:", len(weekly))
          print(
              "Validated daily setups:",
              summary.get("validated_setups", 0)
          )

          print("\n========== TOP WATCHLIST ==========")

          for stock in candidates[:20]:
              if not isinstance(stock, dict):
                  continue

              print(
                  "Symbol:",
                  stock.get("السهم", "N/A"),
                  "| Company:",
                  stock.get("اسم_الشركة", "N/A"),
                  "| Score:",
                  stock.get("درجة_الجودة", "N/A"),
                  "| Status:",
                  stock.get(
                      "الحالة",
                      stock.get("تصنيف_الماسح", "N/A")
                  )
              )

          print("\n========== HISTORICAL FAILURES ==========")

          for item in failed[:20]:
              print(str(item)[:300])

          if total == 0:
              raise RuntimeError(
                  "No TASI stocks returned from directory"
              )

          if analyzed == 0:
              raise RuntimeError(
                  "No stocks were successfully analyzed"
              )

          print("\nSCAN TEST PASSED")
          PY

      - name: Upload market scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasi-market-scan
          path: |
            market_scan_result.json
            market_scan_summary.txt
          if-no-files-found: warn
          retention-days: 14
