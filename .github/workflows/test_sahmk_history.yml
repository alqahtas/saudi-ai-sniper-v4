
name: Test SAHMK Historical Data

on:
  workflow_dispatch:

jobs:
  test-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Test historical date range
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://api.sahmk.sa/api/v1/historical/1120/"

          params = {
              "interval": "1d",
              "from": "2024-01-01",
              "to": "2026-10-30",
              "limit": 500,
              "offset": 0
          }

          response = requests.get(
              url,
              headers={
                  "X-API-Key": os.environ["SAHMK_API_KEY"]
              },
              params=params,
              timeout=40
          )

          print("HTTP STATUS:", response.status_code)
          response.raise_for_status()

          payload = response.json()

          candles = payload.get("data", [])

          print("SYMBOL:", payload.get("symbol"))
          print("FROM:", payload.get("from"))
          print("TO:", payload.get("to"))
          print("TOTAL AVAILABLE:", payload.get("total"))
          print("CANDLES RECEIVED:", len(candles))
          print("HAS MORE:", payload.get("has_more"))
          print("LIMIT:", payload.get("limit"))

          if candles:
              print("FIRST DATE:", candles[0].get("date"))
              print("LAST DATE:", candles[-1].get("date"))
              print("CANDLE FIELDS:", list(candles[0].keys()))

          if len(candles) >= 300:
              print("SUCCESS: ENOUGH HISTORICAL DATA")
          else:
              print("WARNING: INSUFFICIENT HISTORICAL DATA")

          PY
