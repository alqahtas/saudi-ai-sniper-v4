
name: Test SAHMK Historical Data

on:
  workflow_dispatch:

jobs:
  test-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Test 500 historical candles
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://api.sahmk.sa/api/v1/historical/1120/"

          response = requests.get(
              url,
              headers={
                  "X-API-Key": os.environ["SAHMK_API_KEY"]
              },
              params={
                  "interval": "1d",
                  "limit": 500
              },
              timeout=40
          )

          print("HTTP STATUS:", response.status_code)
          response.raise_for_status()

          payload = response.json()
          candles = payload.get("data", [])

          print("TOTAL AVAILABLE:", payload.get("total"))
          print("CANDLES RECEIVED:", len(candles))
          print("HAS MORE:", payload.get("has_more"))
          print("LIMIT:", payload.get("limit"))

          if candles:
              print("CANDLE FIELDS:", list(candles[0].keys()))
              print("FIRST CANDLE:", candles[0])
              print("LAST CANDLE:", candles[-1])

          if len(candles) >= 300:
              print("SUCCESS: Enough candles for analysis")
          else:
              print("WARNING: Fewer than 300 candles")
          PY
