
name: Test SAHMK Historical Data

on:
  workflow_dispatch:

jobs:
  test-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Test Sniper Core on Al Rajhi
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python -u - <<'PY'
          from sniper_core import daily, calculate

          symbol = "1120"

          print("Testing SAHMK historical data...")
          data = daily(symbol)

          if data is None:
              raise RuntimeError(
                  "SAHMK returned insufficient data"
              )

          print("CANDLES:", len(data))
          print("FIRST DATE:", data.index[0])
          print("LAST DATE:", data.index[-1])

          if len(data) < 300:
              raise RuntimeError(
                  "Fewer than 300 daily candles"
              )

          result = calculate(data, symbol)

          print("SYMBOL:", result.get("السهم"))
          print("LIQUIDITY SAR:", result.get("السيولة"))
          print("SCORE:", result.get("درجة_الجودة"))
          print("STATUS:", result.get("الحالة"))
          print(
              "BACKTEST TRADES:",
              result.get("عدد_صفقات_الاختبار")
          )

          print("SNIPER CORE TEST PASSED")
          PY
