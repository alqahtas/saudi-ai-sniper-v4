
name: Test V8 Strategy Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests pandas numpy

      - name: Test V8 on three stocks
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python -u ai_strategy_engine.py 1120 2010 7010

      - name: Verify results
        run: |
          python - <<'PY'
          import json

          with open("ai_strategy_results.json", encoding="utf-8") as f:
              report = json.load(f)

          stocks = report["stocks"]

          for symbol in ("1120", "2010", "7010"):
              result = stocks.get(symbol, {})
              status = result.get("status")
              print(symbol, status)

              if status != "ok":
                  raise RuntimeError(
                      f"{symbol} failed: {result}"
                  )

              strategies = result.get("strategy_comparison", {})
              print("Strategies:", len(strategies))

              if len(strategies) != 5:
                  raise RuntimeError(
                      f"{symbol}: expected five strategies"
                  )

          print("V8 STRATEGY TEST PASSED")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-strategy-test-results
          path: ai_strategy_results.json
          if-no-files-found: warn
          retention-days: 14
