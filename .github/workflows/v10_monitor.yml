
name: V10 Saudi Market Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10_monitor.yml'
      - 'v10_live_monitor.py'
      - 'saudi_ema_stack.py'
      - 'fibonacci.py'
      - 'sahmk_intelligence.py'
  schedule:
    # Riyadh 10:15 through 14:45, Sunday-Thursday
    # GitHub cron uses UTC
    - cron: "15,30,45 7-11 * * 0-4"
    - cron: "0 8-11 * * 0-4"

permissions:
  contents: read
  actions: read

concurrency:
  group: v10-market-monitor
  cancel-in-progress: false

jobs:
  live-connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy requests

      - name: Check V10 Python code
        run: |
          python -m py_compile v10_live_monitor.py

      - name: Verify public alert formatting and delivery offline
        run: python -m unittest discover -s tests -v

      - name: Restore latest V10 watchlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s v10_watchlist.json ]; then
            echo "Existing V10 watchlist found"
          else
            ARTIFACT_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.name == "v10-market-watchlist" or .name == "v10-diagnostics") and .expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')

            if [ -z "$ARTIFACT_ID" ]; then
              echo "::error::No V10 watchlist artifact available"
              exit 1
            fi

            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > /tmp/v10_artifact.zip

            unzip -o /tmp/v10_artifact.zip -d .
          fi

          test -s v10_watchlist.json
          python -m json.tool v10_watchlist.json > /dev/null
          echo "V10 watchlist ready"

      - name: Test SAHMK fresh quote
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          set -o pipefail

          python -u v10_live_monitor.py --check \
            2>&1 | tee /tmp/v10_connection.log

          if grep -q "Connection OK" /tmp/v10_connection.log; then
            echo "Fresh quote verified"
          else
            echo "::error::SAHMK live quote not verified"
            exit 1
          fi

      - name: Restore prior alert cooldown state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "v10-alert-state" and .expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$STATE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ID}/zip" > /tmp/v10_alert_state.zip
            unzip -o /tmp/v10_alert_state.zip -d .
            echo "Restored prior V10 alert state"
          else
            echo "No prior alert state. Starting fresh."
          fi

      - name: Scan current watchlist and send actionable watch alerts
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Telegram token missing"; exit 1; }
          { test -n "$TELEGRAM_CHAT_ID" || test -n "$TELEGRAM_CHANNEL_ID"; } || {
            echo "::error::Telegram owner/channel target missing"; exit 1;
          }
          python -u v10_live_monitor.py --once

      - name: Save alert cooldown state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-alert-state
          path: |
            v10_monitor_state.json
            v10_events.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload diagnostic watchlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-diagnostics
          path: v10_watchlist.json
          if-no-files-found: ignore

