
name: V10 Saudi Market Monitor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy requests

      - name: Check Python code
        run: |
          python -m py_compile v10_live_monitor.py
          echo "Python code OK"

      - name: Restore previous V10 watchlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s v10_watchlist.json ]; then
            echo "Watchlist already exists"
            exit 0
          fi

          echo "Searching previous GitHub artifacts..."

          ARTIFACT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "v10-market-watchlist" and .expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No previous V10 watchlist artifact found"
            exit 1
          fi

          echo "Found artifact ID: $ARTIFACT_ID"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/v10_watchlist.zip

          unzip -o /tmp/v10_watchlist.zip -d .

          if [ ! -s v10_watchlist.json ]; then
            echo "::error::Watchlist JSON not found in artifact"
            exit 1
          fi

          python -m json.tool v10_watchlist.json > /dev/null
          echo "Watchlist restored successfully"

      - name: Test SAHMK Pro connection
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python -u v10_live_monitor.py --check

      - name: Upload diagnostic watchlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-diagnostics
          path: v10_watchlist.json
          if-no-files-found: ignore
