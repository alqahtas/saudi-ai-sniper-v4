
name: V10 Saudi Market Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas numpy requests

      - name: Scan all Saudi stocks
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python -u v10_live_monitor.py --scan

      - name: Upload V10 watchlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-market-watchlist
          path: v10_watchlist.json
          if-no-files-found: warn
