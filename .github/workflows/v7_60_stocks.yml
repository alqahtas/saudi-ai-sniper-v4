
name: Saudi AI Sniper - V7.1 60 Stocks Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-60-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy pandas requests yfinance

      - name: Run V7.1 research on 60 stocks
        env:
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
        run: |
          python v7_60_stocks_lab.py

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-60-stocks-results
          path: |
            v7_60_stocks_results.json
            v7_60_stocks_results.csv
            v7_60_stocks_summary.csv
          if-no-files-found: warn
          retention-days: 14
